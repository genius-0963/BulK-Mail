kind = "web"
previewPath = "/"
title = "Gmail Campaign Sender"
description = "A private Gmail campaign app for composing personalized one-time outreach to up to 100 individually addressed contacts, reviewing every message, and sending the approved batch from the connected Gmail account."
version = "1.0.0"
id = "artifacts/gmail-campaign"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25726

[services.development]
run = "pnpm --filter @workspace/gmail-campaign run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gmail-campaign", "run", "build" ]
serve = "static"
publicDir = "artifacts/gmail-campaign/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25726"
BASE_PATH = "/"
